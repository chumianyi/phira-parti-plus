name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Parti+⁺ APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust nightly
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          export PATH=$HOME/.cargo/bin:$PATH
          rustup toolchain install nightly-2026-01-01 --profile minimal
          rustup target add --toolchain nightly-2026-01-01 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Setup Android SDK + NDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          cargo install cargo-ndk --locked

      - name: Build native libraries (cargo-ndk)
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cd $GITHUB_WORKSPACE
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs build --release -p phira-main

      - name: Setup Java 17 + Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK (gradle)
        run: |
          cd $GITHUB_WORKSPACE/android
          gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parti-plus-rust-apk
          path: android/app/build/outputs/apk/release/app-release.apk
